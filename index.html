    :root{

    }
    *{box-sizing:border-box}

    .rc-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
    .rc-mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#eaf1ea}
    .rc-word{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.2px}
    .rc-sub{font-size:11px;color:#a9c4b0}
    .rc-nav{display:flex;flex-direction:column;gap:3px;flex:1}
    .rc-navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:transparent;color:#c8d9cc;border-radius:9px;font-size:14px;text-align:left;transition:background .12s,color .12s}
    .rc-navlink:hover{background:rgba(255,255,255,.07);color:#fff}

    .rc-pagehead p{margin:5px 0 0;font-size:13.5px;max-width:620px}
    .rc-muted{color:var(--muted)}
    .rc-small{font-size:12px}
    .rc-mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px}
    .rc-amount{font-family:var(--serif);font-variant-numeric:tabular-nums}
    .rc-flex{display:flex;align-items:center;gap:8px}

    .rc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
    .rc-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .rc-card-head h3{font-size:15px;font-weight:600}
    .rc-stack{display:flex;flex-direction:column;gap:12px}

    .rc-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .rc-stat{display:flex;flex-direction:column;gap:4px}
    .rc-stat-ic{width:34px;height:34px;border-radius:9px;background:#e7efe8;color:var(--forest);display:grid;place-items:center;margin-bottom:6px}
    .rc-stat-val{font-family:var(--serif);font-size:26px;font-weight:600}
    .rc-stat-lbl{font-size:12.5px;color:var(--muted)}

    /* tables */
    .rc-table{width:100%;border-collapse:collapse;font-size:13.5px}
    .rc-table th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:0 12px 10px}
    .rc-table td{padding:12px;border-top:1px solid var(--line);vertical-align:top}
    .rc-rowclick{cursor:pointer;transition:background .1s}
    .rc-rowclick:hover{background:#f3f0e7}
    .rc-avatar{width:26px;height:26px;border-radius:7px;background:#e7efe8;color:var(--forest);display:grid;place-items:center}
    .rc-tag,.rc-badge{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block}

    .rc-link{background:none;border:0;color:var(--forest);font-weight:600;font-size:13px}
    .rc-btn{display:inline-flex;align-items:center;gap:7px;background:var(--forest);color:#fff;border:0;padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600;transition:filter .12s}
    .rc-btn:hover{filter:brightness(1.08)}
    .rc-btn:disabled{opacity:.4;cursor:not-allowed}
    .rc-btn.ghost{background:#eee9db;color:var(--ink)}
    .rc-icon-btn{background:none;border:0;color:var(--muted);padding:5px;border-radius:7px;display:grid;place-items:center}
    .rc-icon-btn:hover{background:#f0ece0;color:var(--ink)}

    /* catalogue */
    .rc-presta{padding:0;overflow:hidden}

    .rc-presta-head:hover{background:#f6f3ea}
    .rc-presta-title{font-weight:600;font-size:14.5px}
    .rc-cat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
    .rc-cat.sm{font-size:10.5px;padding:2px 7px}
    .rc-marge-badge{text-align:right;line-height:1.1}
    .rc-marge-badge span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .rc-marge-badge strong{font-family:var(--serif);color:var(--ochre);font-size:16px}
    .rc-presta-body{border-top:1px solid var(--line);padding:16px 18px;background:#fbf9f3}
    .rc-split{display:flex;gap:16px}
    .rc-half{flex:1;min-width:0}
    .rc-client-face,.rc-intern-face{border-radius:11px;padding:14px}
    .rc-client-face{background:#eef4ef;border:1px solid #dbe8de}
    .rc-intern-face{background:var(--ochre-w);border:1px solid #ecdcc0}
    .rc-facelbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:5px;margin-bottom:9px;color:var(--muted)}
    .rc-bullets{padding-left:17px;font-size:13px;line-height:1.55}
    .rc-bullets.sm{font-size:12px;color:var(--muted);margin-top:4px}
    .rc-priceline{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px dashed #cddccf;font-weight:600}
    .rc-priceline .rc-amount{font-size:17px;color:var(--forest)}
    .rc-costrow{font-size:11px;font-weight:700;color:var(--ochre);display:flex;align-items:center;gap:5px;margin:9px 0 3px;text-transform:uppercase;letter-spacing:.03em}
    .rc-cost{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
    .rc-cost em{font-style:normal}
    .rc-cost-tot{margin-top:8px;padding-top:8px;border-top:1px solid #e3cfa9;font-weight:600}
    .rc-cost-marge{font-weight:700;color:var(--ochre)}
    .rc-note{margin-top:10px;font-size:12px;background:#fff;border:1px solid #ecdcc0;border-radius:8px;padding:8px 10px;color:#7a6033}

    /* builder */
    .rc-field-lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
    .rc-select,.rc-input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
    .rc-select.sm{width:auto;padding:8px 10px}
    .rc-add-presta{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;text-align:left;transition:border-color .12s,background .12s}
    .rc-add-presta:hover{border-color:var(--sage);background:#f6faf6}
    .rc-cart{position:sticky;top:20px}
    .rc-cartline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
    .rc-qte{width:58px;padding:6px;border:1px solid var(--line);border-radius:7px;text-align:center}
    .rc-totals{margin-top:14px;font-size:13.5px}
    .rc-totals>div{display:flex;justify-content:space-between;padding:3px 0}
    .rc-ttc{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:15px}
    .rc-empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}

    /* toggle */
    .rc-toggle{display:flex;background:#eee9db;border-radius:10px;padding:3px}
    .rc-toggle button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600}
    .rc-toggle button.on{color:#fff}

    /* doc */
    .rc-doc{padding:26px 30px}
    .rc-doc-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:2px solid var(--forest)}
    .rc-doc-title{font-family:var(--serif);font-size:22px;font-weight:600}
    .rc-doc-parties{display:flex;gap:60px;padding:18px 0;border-bottom:1px solid var(--line)}
    .rc-doc-table{margin-top:10px}
    .rc-doc-tot{margin:16px 0 0;margin-left:auto;width:280px;font-size:14px}
    .rc-doc-tot>div{display:flex;justify-content:space-between;padding:4px 0}
    .rc-doc-note{margin-top:18px;font-size:12.5px;color:var(--forest);background:#eef4ef;border-radius:9px;padding:10px 13px}
    .rc-intern-banner{display:flex;align-items:center;gap:7px;background:var(--ochre-w);color:#7a6033;font-size:12.5px;padding:10px 13px;border-radius:9px;margin:6px 0 16px;font-weight:600}
    .rc-intern-line{padding:13px 0;border-bottom:1px solid var(--line)}
    .rc-intern-costs{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
    .rc-chip{display:inline-flex;align-items:center;gap:4px;background:#f3f0e7;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11.5px;color:#6b6353}
    .rc-intern-sums{display:flex;gap:20px;font-size:12.5px;color:var(--muted)}
    .rc-marge-txt{color:var(--ochre);font-weight:600}
    .rc-doc-tot.intern>div{border-top:1px solid var(--line)}

    /* filters */
    .rc-filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .rc-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 12px;flex:1;min-width:220px;color:var(--muted)}
    .rc-search input{border:0;outline:0;padding:10px 0;flex:1;background:none}

    /* modal */
    .rc-overlay{position:fixed;inset:0;background:rgba(27,42,32,.4);display:grid;place-items:center;padding:20px;z-index:50}
    .rc-modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
    .rc-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .rc-modal-head h3{font-family:var(--serif);font-size:19px}
    .rc-fieldw{margin-bottom:13px}
    .rc-seg,.rc-toggle{display:inline-flex;background:#eee9db;border-radius:9px;padding:3px}
    .rc-seg button{border:0;background:none;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
    .rc-seg button.on{background:var(--forest);color:#fff}
    .rc-live-marge{display:flex;justify-content:space-between;background:var(--ochre-w);border-radius:9px;padding:11px 13px;font-size:13px;margin:6px 0 2px}

    .rc-modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

      .rc-main{padding:22px 16px}
      .rc-grid4{grid-template-columns:repeat(2,1fr)}

    }
    `})}mc(document.getElementById("root")).render(s.jsx(gp,{}));
